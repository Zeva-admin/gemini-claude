<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Bridge</title>
  <style>
    :root {
      --bg:          #0a0a0a;
      --bg-2:        #111111;
      --bg-3:        #1a1a1a;
      --border:      rgba(255,255,255,0.08);
      --border-s:    rgba(255,255,255,0.14);
      --text-1:      #f0f0f0;
      --text-2:      #888;
      --text-3:      #555;
      --accent:      #7c6aff;
      --accent-h:    #9580ff;
      --gemini:      #1a9e6e;
      --gemini-bg:   rgba(26,158,110,0.08);
      --user-bg:     rgba(124,106,255,0.10);
      --think-bg:    rgba(255,200,80,0.06);
      --think-border:rgba(255,200,80,0.2);
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   18px;
      --ease:        cubic-bezier(0.16,1,0.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 10;
      flex-shrink: 0;
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
    }

    .logo-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gemini);
      box-shadow: 0 0 8px rgba(26,158,110,0.6);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.6; transform:scale(0.85); }
    }

    .status {
      font-size: 12px; color: var(--text-2);
      display: flex; align-items: center; gap: 6px;
    }

    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3);
      transition: background 0.3s;
    }
    .status-dot.online { background: var(--gemini); }

    /* ── SESSION BAR ── */
    .session-bar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-2);
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }

    .session-bar input {
      flex: 1;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-1);
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      font-family: 'SF Mono', 'Fira Code', monospace;
      transition: border-color 0.15s;
    }
    .session-bar input:focus { border-color: var(--accent); }
    .session-bar input::placeholder { color: var(--text-3); }

    .session-bar label { font-size: 11px; color: var(--text-2); white-space: nowrap; }

    .btn-new {
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 11px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-new:hover { border-color: var(--border-s); color: var(--text-1); }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border-s); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeUp 0.3s var(--ease) both;
      max-width: 760px;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .msg.user { align-items: flex-end; align-self: flex-end; }
    .msg.gemini { align-items: flex-start; align-self: flex-start; }

    .msg-label {
      font-size: 11px; color: var(--text-3);
      padding: 0 4px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-bubble {
      background: var(--user-bg);
      border: 1px solid rgba(124,106,255,0.2);
      border-bottom-right-radius: 4px;
    }

    .msg.gemini .msg-bubble {
      background: var(--gemini-bg);
      border: 1px solid rgba(26,158,110,0.15);
      border-bottom-left-radius: 4px;
      color: var(--text-1);
    }

    /* thinking block */
    .thinking-block {
      background: var(--think-bg);
      border: 1px solid var(--think-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .thinking-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      color: rgba(255,200,80,0.7);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .thinking-header:hover { color: rgba(255,200,80,0.9); }

    .thinking-arrow {
      transition: transform 0.2s var(--ease);
      font-size: 10px;
    }
    .thinking-block.open .thinking-arrow { transform: rotate(90deg); }

    .thinking-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s var(--ease);
      font-size: 12px;
      color: rgba(255,200,80,0.5);
      line-height: 1.6;
      white-space: pre-wrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
      padding: 0 12px;
    }
    .thinking-block.open .thinking-body {
      max-height: 400px;
      padding: 0 12px 10px;
    }

    /* loading dots */
    .loading-bubble {
      padding: 14px 18px;
      background: var(--gemini-bg);
      border: 1px solid rgba(26,158,110,0.15);
      border-radius: var(--radius-lg);
      border-bottom-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gemini);
      opacity: 0.4;
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%,80%,100% { opacity:0.4; transform:scale(1); }
      40%          { opacity:1; transform:scale(1.3); }
    }

    /* empty state */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: var(--text-3);
      text-align: center; padding: 40px;
      pointer-events: none;
    }
    .empty-icon { font-size: 40px; opacity: 0.4; }
    .empty-text { font-size: 14px; line-height: 1.5; }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex; gap: 10px; align-items: flex-end;
      flex-shrink: 0;
    }

    .input-wrap {
      flex: 1;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      display: flex; align-items: flex-end;
      padding: 10px 14px;
      transition: border-color 0.15s;
      gap: 10px;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-1);
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
      max-height: 140px;
      min-height: 22px;
    }
    textarea::placeholder { color: var(--text-3); }

    .send-btn {
      width: 34px; height: 34px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s var(--ease);
      font-size: 16px;
    }
    .send-btn:hover { background: var(--accent-h); transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── SERVER CONFIG MODAL ── */
    .config-btn {
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 18px;
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .config-btn:hover { border-color: var(--border-s); color: var(--text-1); }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--bg-2);
      border: 1px solid var(--border-s);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: min(420px, calc(100vw - 40px));
      display: flex; flex-direction: column; gap: 16px;
      transform: translateY(10px);
      transition: transform 0.25s var(--ease);
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--text-2); }
    .field input {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-1);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      font-family: 'SF Mono', 'Fira Code', monospace;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--accent); }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .btn-save {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-save:hover { background: var(--accent-h); }

    .btn-cancel {
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--text-2);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-cancel:hover { color: var(--text-1); border-color: var(--border-s); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--bg-3);
      border: 1px solid var(--border-s);
      border-radius: var(--radius-full);
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text-1);
      opacity: 0;
      transition: all 0.25s var(--ease);
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-dot"></div>
    Gemini Bridge
  </div>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">не подключён</span>
  </div>
</header>

<!-- SESSION BAR -->
<div class="session-bar">
  <label>session:</label>
  <input type="text" id="sessionId" placeholder="создастся автоматически" readonly />
  <button class="btn-new" onclick="newSession()">+ новая</button>
</div>

<!-- MESSAGES -->
<div class="messages" id="messages">
  <div class="empty">
    <div class="empty-icon">◈</div>
    <div class="empty-text">Введи сообщение чтобы начать диалог с Gemini</div>
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <button class="config-btn" onclick="openConfig()" title="Настройки сервера">⚙</button>
  <div class="input-wrap">
    <textarea
      id="input"
      placeholder="Напиши сообщение..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
</div>

<!-- CONFIG MODAL -->
<div class="modal-overlay" id="modal" onclick="closeOnOverlay(event)">
  <div class="modal">
    <h2>Настройки сервера</h2>
    <div class="field">
      <label>URL сервера (Render)</label>
      <input type="text" id="serverUrl" placeholder="https://gemini-claude.onrender.com" />
    </div>
    <div class="field">
      <label>Thinking budget (токены, 0 = выкл)</label>
      <input type="number" id="thinkingBudget" value="4000" min="0" max="32000" />
    </div>
    <div class="field">
      <label>System prompt (необязательно)</label>
      <input type="text" id="systemPrompt" placeholder="Ты помощник..." />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeConfig()">Отмена</button>
      <button class="btn-save" onclick="saveConfig()">Сохранить</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ── STATE ──
  let config = {
    serverUrl: localStorage.getItem('serverUrl') || 'https://gemini-claude.onrender.com',
    thinkingBudget: parseInt(localStorage.getItem('thinkingBudget') || '4000'),
    systemPrompt: localStorage.getItem('systemPrompt') || '',
  };
  let sessionId = null;
  let isLoading = false;

  // ── INIT ──
  document.getElementById('serverUrl').value = config.serverUrl;
  document.getElementById('thinkingBudget').value = config.thinkingBudget;
  document.getElementById('systemPrompt').value = config.systemPrompt;
  checkHealth();

  // ── HEALTH CHECK ──
  async function checkHealth() {
    try {
      const r = await fetch(`${config.serverUrl}/health`, { signal: AbortSignal.timeout(5000) });
      if (r.ok) {
        document.getElementById('statusDot').className = 'status-dot online';
        document.getElementById('statusText').textContent = 'подключён';
      } else throw new Error();
    } catch {
      document.getElementById('statusDot').className = 'status-dot';
      document.getElementById('statusText').textContent = 'нет связи';
    }
  }

  // ── SESSION ──
  async function newSession() {
    try {
      const r = await fetch(`${config.serverUrl}/session/new`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_prompt: config.systemPrompt || null }),
      });
      const data = await r.json();
      sessionId = data.session_id;
      document.getElementById('sessionId').value = sessionId;
      clearMessages();
      toast('Новая сессия: ' + sessionId);
    } catch(e) {
      toast('Ошибка: ' + e.message);
    }
  }

  // ── SEND ──
  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    autoResize(input);
    addMessage('user', text);
    removeEmpty();

    const loadingEl = addLoading();
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    try {
      const body = {
        message: text,
        thinking_budget: config.thinkingBudget,
      };
      if (sessionId) body.session_id = sessionId;
      if (config.systemPrompt) body.system_prompt = config.systemPrompt;

      const r = await fetch(`${config.serverUrl}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();

      sessionId = data.session_id;
      document.getElementById('sessionId').value = sessionId;

      loadingEl.remove();
      addMessage('gemini', data.response, data.thinking);
    } catch(e) {
      loadingEl.remove();
      addError(e.message);
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }

  // ── DOM HELPERS ──
  function removeEmpty() {
    const empty = document.querySelector('.empty');
    if (empty) empty.remove();
  }

  function addMessage(role, text, thinking = '') {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'вы' : 'gemini';
    wrap.appendChild(label);

    if (thinking) {
      const thinkEl = document.createElement('div');
      thinkEl.className = 'thinking-block';
      thinkEl.innerHTML = `
        <div class="thinking-header" onclick="toggleThink(this.parentElement)">
          <span class="thinking-arrow">▶</span>
          рассуждения
        </div>
        <div class="thinking-body">${escHtml(thinking)}</div>
      `;
      wrap.appendChild(thinkEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);

    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return wrap;
  }

  function addLoading() {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg gemini';
    wrap.innerHTML = `
      <div class="msg-label">gemini</div>
      <div class="loading-bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    `;
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return wrap;
  }

  function addError(msg) {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg gemini';
    wrap.innerHTML = `
      <div class="msg-label">ошибка</div>
      <div class="msg-bubble" style="border-color:rgba(255,59,48,0.3);background:rgba(255,59,48,0.06);color:#ff6b6b">${escHtml(msg)}</div>
    `;
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function clearMessages() {
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `<div class="empty"><div class="empty-icon">◈</div><div class="empty-text">Новая сессия начата</div></div>`;
  }

  function toggleThink(el) {
    el.classList.toggle('open');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── INPUT ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  // ── CONFIG MODAL ──
  function openConfig() {
    document.getElementById('modal').classList.add('open');
  }
  function closeConfig() {
    document.getElementById('modal').classList.remove('open');
  }
  function closeOnOverlay(e) {
    if (e.target === e.currentTarget) closeConfig();
  }
  function saveConfig() {
    config.serverUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
    config.thinkingBudget = parseInt(document.getElementById('thinkingBudget').value) || 0;
    config.systemPrompt = document.getElementById('systemPrompt').value.trim();
    localStorage.setItem('serverUrl', config.serverUrl);
    localStorage.setItem('thinkingBudget', config.thinkingBudget);
    localStorage.setItem('systemPrompt', config.systemPrompt);
    closeConfig();
    checkHealth();
    toast('Настройки сохранены');
  }

  // ── TOAST ──
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
